<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>witr — Why Is This Running? (Web Dashboard)</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
</head>
<body>
  <div id="app" class="app-layout">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo-group">
          <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <path d="M11 8v6"></path>
              <path d="M8 11h6"></path>
            </svg>
          </div>
          <span class="logo-title">witr</span>
          <span class="logo-subtitle">Why is this running?</span>
          <span class="badge version-badge" id="versionBadge">v0.3.3</span>
        </div>
      </div>

      <div class="header-center">
        <!-- Global Search Palette (native-ai-ui search style) -->
        <div class="search-box">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="globalSearchInput" placeholder="按名称、PID、端口、容器或命令过滤 (按 '/' 快速定位)..." autocomplete="off" spellcheck="false">
          <kbd class="search-kbd">/</kbd>
          <button id="clearSearchBtn" class="clear-search-btn" title="清空搜索" style="display:none;">&times;</button>
        </div>
      </div>

      <div class="header-right">
        <!-- Live Refresh Controls -->
        <div class="refresh-controls">
          <span class="live-dot" id="liveIndicator" title="实时采集正常"></span>
          <span class="refresh-label" id="refreshTimerLabel">3s</span>
          <select id="refreshRateSelect" class="select-control" title="选择自动刷新频率">
            <option value="1000">1s 极速</option>
            <option value="3000" selected>3s 标准</option>
            <option value="5000">5s 低耗</option>
            <option value="0">暂停刷新</option>
          </select>
          <button id="manualRefreshBtn" class="btn btn-icon" title="手动立即刷新">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
          </button>
        </div>

        <!-- Theme Toggle (Follows System by Default) -->
        <button id="themeToggleBtn" class="btn btn-icon" title="当前主题: 跟随系统">
          <svg id="themeIconAuto" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <svg id="themeIconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="themeIconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- App Body (Sidebar + Content + Inspector) -->
    <div class="app-body">
      <!-- Left Sidebar Nav (native-ai-ui sidebar-nav style) -->
      <aside class="sidebar-nav">
        <div class="nav-section-title">视图导航</div>
        <nav class="nav-items">
          <button class="nav-item active" data-tab="processes">
            <span class="nav-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
            </span>
            <span class="nav-label">进程 (Processes)</span>
            <span class="nav-count" id="countProcesses">0</span>
          </button>

          <button class="nav-item" data-tab="ports">
            <span class="nav-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </span>
            <span class="nav-label">端口 (Ports)</span>
            <span class="nav-count" id="countPorts">0</span>
          </button>

          <button class="nav-item" data-tab="containers">
            <span class="nav-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
              </svg>
            </span>
            <span class="nav-label">容器 (Containers)</span>
            <span class="nav-count" id="countContainers">0</span>
          </button>

          <button class="nav-item" data-tab="locks">
            <span class="nav-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <span class="nav-label">文件锁 (Locks)</span>
            <span class="nav-count" id="countLocks">0</span>
          </button>
        </nav>

        <div class="nav-section-title" style="margin-top: 24px;">快捷过滤</div>
        <div class="filter-chips">
          <button class="chip" data-filter="high-cpu">🔥 高 CPU (>90%)</button>
          <button class="chip" data-filter="high-mem">💾 高内存 (>1GB)</button>
          <button class="chip" data-filter="sockets">🌐 监听网络端口</button>
          <button class="chip" data-filter="forked">🌿 派生子进程</button>
          <button class="chip" data-filter="root">🛡️ Root / 管理员</button>
        </div>

        <!-- System Telemetry Card (native-ai-ui session-telemetry style) -->
        <div class="sidebar-telemetry">
          <div class="telemetry-header">
            <span class="telemetry-title">系统状态</span>
            <span class="badge" id="telemetryOS">Darwin arm64</span>
          </div>
          <div class="telemetry-grid">
            <div class="telemetry-item">
              <span class="telemetry-label">主机名</span>
              <span class="telemetry-val" id="telemetryHost">-</span>
            </div>
            <div class="telemetry-item">
              <span class="telemetry-label">CPU 核心</span>
              <span class="telemetry-val" id="telemetryCPU">-</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Center Main Workspace (records-table & filter-table style) -->
      <main class="main-content">
        <!-- View Toolbar -->
        <div class="content-toolbar">
          <div class="toolbar-left">
            <h2 class="view-title" id="viewTitle">进程监控与因果溯源</h2>
            <span class="view-meta" id="viewMeta">加载中...</span>
          </div>
          <div class="toolbar-right" id="tabCustomControls">
            <!-- Dynamic extra buttons depending on active tab -->
          </div>
        </div>

        <!-- Table Container -->
        <div class="table-card">
          <div class="table-scroll-wrapper">
            <table class="records-grid" id="mainGrid">
              <thead id="gridHead">
                <!-- Dynamically populated -->
              </thead>
              <tbody id="gridBody">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
          <div class="empty-placeholder" id="emptyPlaceholder" style="display:none;">
            <div class="placeholder-icon">🔍</div>
            <div class="placeholder-text">未找到匹配的记录</div>
            <div class="placeholder-hint">尝试修改搜索词或重置快捷过滤</div>
          </div>
        </div>
      </main>

      <!-- Right Inspection Side Panel (causal-chain-tree, telemetry & warnings) -->
      <aside class="detail-panel" id="detailPanel">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-tag" id="panelTag">Process</span>
            <h3 class="panel-title" id="panelTitle">选择一个进程以分析</h3>
          </div>
          <div class="panel-actions">
            <button id="closePanelBtn" class="btn btn-icon" title="关闭详情面板">&times;</button>
          </div>
        </div>

        <div class="panel-body" id="panelContent">
          <div class="empty-detail-guide">
            <div class="guide-icon">👆</div>
            <p>在左侧列表中点击任意行</p>
            <p class="guide-sub">witr 将立即解析其完整的启动因果链、工作目录、Git 分支、Socket 状态及安全告警</p>
          </div>
        </div>
      </aside>
    </div>

    <!-- Action Approval Modal (approval-card style) -->
    <div class="modal-backdrop" id="actionModal" style="display:none;">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-icon-badge" id="modalActionIcon">⚠️</div>
          <div>
            <h3 class="modal-title" id="modalActionTitle">确认进程操作</h3>
            <p class="modal-sub" id="modalActionSub">对目标进程发送系统控制信号</p>
          </div>
        </div>
        <div class="modal-body" id="modalActionBody">
          <p>您确定要对进程执行此操作吗？</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="modalCancelBtn">取消</button>
          <button class="btn btn-danger" id="modalConfirmBtn">确认执行</button>
        </div>
      </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
